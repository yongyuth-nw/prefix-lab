<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prefix-to-Speech Lab</title><style>
:root{--navy:#12233f;--blue:#2563eb;--mint:#0d9488;--bg:#f4f7fb;--line:#dce4f0;--text:#1b2a44}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,'Noto Sans Thai',sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;font-weight:650;background:var(--blue);color:white}button.secondary{background:white;color:var(--navy);border:1px solid var(--line)}button.active{background:var(--mint)}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:11px;background:white;width:100%}textarea{min-height:85px}header{background:var(--navy);color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header small{color:#c7d7f2}main{max-width:1160px;margin:24px auto;padding:0 16px 50px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 6px 24px #132b5010;margin-bottom:16px}.muted{color:#66768d}.small{font-size:.87rem}.pill{display:inline-block;background:#e8f5f2;color:#08766b;padding:5px 10px;border-radius:99px;font-weight:700;font-size:.82rem}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.nav button{background:white;color:var(--navy);border:1px solid var(--line)}.nav button.active{background:var(--blue);color:white}.choice{display:block;width:100%;margin:8px 0;text-align:left;background:#f5f8fe;color:var(--navy);border:1px solid var(--line)}.choice.selected{background:#dff7f0;border-color:#0d9488}.scenario{background:#eff6ff;border-left:5px solid var(--blue);border-radius:10px;padding:18px;font-size:1.16rem;line-height:1.6}.notice{padding:13px;border-radius:12px;background:#fff6e6;color:#80530b}.good{background:#e8f8f0;color:#17643e}.stats{font-size:2rem;font-weight:800;color:var(--blue)}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.scroll{overflow:auto}.steps{display:flex;gap:6px;flex-wrap:wrap}.steps span{padding:9px 12px;border-radius:10px;background:#edf2fb;font-size:.84rem}.steps .current{background:var(--blue);color:white}.hidden{display:none!important}.section-title{font-size:1.5rem;margin:8px 0 18px}footer{text-align:center;color:#6e7d93;padding:22px}.tag{font-size:.76rem;background:#e7edf6;padding:4px 8px;border-radius:7px}.rubric{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin:12px 0}@media(max-width:740px){.grid,.three{grid-template-columns:1fr}.card{padding:16px}header{padding:14px}main{margin:12px auto}.rubric{grid-template-columns:1fr 90px}}
</style></head><body><header><div><strong style="font-size:1.25rem">🧩 Prefix-to-Speech Lab</strong><div><small>Understand problems · Give advice · Speak again</small></div></div><div class="bar"><span class="pill">M.5 · Hybrid Classroom</span><button class="secondary" onclick="setRole('teacher')">Teacher</button><button class="secondary" onclick="setRole('student')">Student</button></div></header><main id="app"></main><footer>Offline single-browser prototype · No real student data is transmitted · Teacher-created learning tool</footer><script>
const MISSIONS=[{id:'A',title:'A Misunderstanding',text:"I misunderstood my friend's message. Now my friend is unhappy.",words:['misunderstood','unhappy'],solutions:['You should reread the message.','You should talk to your friend.'],reason:'You can understand each other better.'},{id:'B',title:'Before the Test',text:"I feel unprepared for tomorrow's English test. Some questions seem impossible.",words:['unprepared','impossible'],solutions:['You should review your notes.','You should ask your teacher for help.'],reason:'You can prepare and understand difficult questions.'},{id:'C',title:'Group Project',text:'My friend and I disagree about our group project. Our plan is incomplete.',words:['disagree','incomplete'],solutions:["You should listen to each other's ideas.",'You should complete the plan together.'],reason:'Everyone can share ideas and finish the project.'},{id:'D',title:'Checking My Work',text:'I was irresponsible and did not check my homework. Some answers are incorrect.',words:['irresponsible','incorrect'],solutions:['You should reread the instructions.','You should correct your answers.'],reason:'You can find and fix mistakes.'}];
const QUIZ=[{q:'Unhappy means…',opts:['not happy','very happy'],a:0},{q:'Disagree means…',opts:['have the same opinion','have different opinions'],a:1},{q:'Misunderstand means…',opts:['understand incorrectly','understand perfectly'],a:0},{q:'Reread means…',opts:['read again','read before'],a:0},{q:'Impossible means…',opts:['not possible','possible'],a:0}];
const CHECK=[{q:'Unprepared means…',opts:['not ready','ready'],a:0},{q:'Disagree means…',opts:['have different opinions','have the same opinion'],a:0},{q:'Reread means…',opts:['read again','read quickly'],a:0},{q:'You ___ talk to your friend.',opts:['should','are'],a:0},{q:'Advice for an incomplete project?',opts:['Finish the missing parts.','Ignore the project.'],a:0}];
const KEY='prefixlab_demo_v1';const init={session:'583214',phase:0,students:{},observations:[],feedback:[],activeMission:'A'};let db=load(),role='teacher',studentCode='',studentTab='mission',teacherTab='control',missionId='A',support=1,quizKind='diagnostic';function load(){try{return {...init,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(init)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function m(){return MISSIONS.find(x=>x.id===missionId)||MISSIONS[0]}function student(){return db.students[studentCode]}function setRole(r){role=r;render()}function setPhase(n){db.phase=n;save();render()}function setTeacherTab(t){teacherTab=t;render()}function setStudentTab(t){studentTab=t;render()}function setMission(id){missionId=id;db.activeMission=id;save();render()}function setSupport(n){support=+n;if(student()){student().support=support;save()}render()}function join(){const code=document.getElementById('code').value.trim().toUpperCase();const room=document.getElementById('room').value.trim();if(!/^[A-Z0-9-]{2,12}$/.test(code)||room!==db.session){alert('Check your student code and classroom code.');return}studentCode=code;db.students[code]??={code,joined:new Date().toISOString(),support:1};support=db.students[code].support||1;save();render()}function leave(){studentCode='';render()}function resetDemo(){if(confirm('Delete ALL locally stored demo data on this browser?')){db=structuredClone(init);save();render()}}function choose(kind,index,option){const st=student();if(!st)return;st[kind]??={};st[kind][index]=option;save();render()}function score(kind){const st=student();const qs=kind==='diagnostic'?QUIZ:CHECK;return qs.reduce((n,q,i)=>n+(st?.[kind]?.[i]===q.a?1:0),0)}function answerQuiz(kind){quizKind=kind;studentTab='quiz';render()}function submitReflection(){const st=student();st.reflection={confidence:+document.getElementById('confidence').value,goal:document.getElementById('goal').value.trim(),at:new Date().toISOString()};save();render()}function saveAdvice(){const st=student();st.advice={mission:missionId,first:document.getElementById('adv1').value.trim(),second:document.getElementById('adv2').value.trim(),reason:document.getElementById('reason').value.trim(),at:new Date().toISOString()};save();render()}function recordAssessment(){const code=document.getElementById('assessCode').value.trim().toUpperCase();if(!db.students[code]){alert('Student code not found. Join as student first.');return}const values=['prefix','communication','interaction'].map(k=>+document.getElementById(k).value);const row={id:Date.now(),code,mission:document.getElementById('assessMission').value,attempt:+document.getElementById('attempt').value,scores:values,feedback:document.getElementById('feedback').value.trim(),supportObserved:+document.getElementById('supportObserved').value,at:new Date().toISOString()};db.observations.push(row);save();render()}function csv(){const rows=[['student_code','joined','diagnostic_5','check_5','support_selected','confidence_3','reflection_goal','attempt','mission','prefix_2','communication_2','interaction_2','total_6','support_observed','feedback','assessment_time']];for(const [code,s] of Object.entries(db.students)){const obs=db.observations.filter(x=>x.code===code);if(!obs.length)obs.push(null);for(const o of obs){const count=k=>(k==='diagnostic'?QUIZ:CHECK).reduce((n,q,i)=>n+(s[k]?.[i]===q.a?1:0),0);rows.push([code,s.joined,Object.keys(s.diagnostic||{}).length?count('diagnostic'):'',Object.keys(s.check||{}).length?count('check'):'',s.support||'',s.reflection?.confidence||'',s.reflection?.goal||'',o?.attempt||'',o?.mission||'',o?.scores[0]??'',o?.scores[1]??'',o?.scores[2]??'',o?o.scores.reduce((a,b)=>a+b,0):'',o?.supportObserved||'',o?.feedback||'',o?.at||''])}}const out='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv;charset=utf-8'}));a.download='prefix-to-speech-evidence.csv';a.click();URL.revokeObjectURL(a.href)}
const PHASES=['Prefix Recall · 5 min','Context Detectives · 10 min','Pair Talk · 10 min','Problem-Solving Clinic · 17 min','Wrap-up & Check · 8 min'];function teacher(){const codes=Object.keys(db.students);const avg=db.observations.length?(db.observations.reduce((n,o)=>n+o.scores.reduce((a,b)=>a+b,0),0)/db.observations.length).toFixed(1):'—';return `<h1 class="section-title">Teacher Dashboard <span class="pill">Classroom ${db.session}</span></h1><div class="grid three"><div class="card"><div class="muted">Joined learners</div><div class="stats">${codes.length}</div></div><div class="card"><div class="muted">Recorded speaking attempts</div><div class="stats">${db.observations.length}</div></div><div class="card"><div class="muted">Average assessed score / 6</div><div class="stats">${avg}</div></div></div><div class="nav">${[['control','Classroom control'],['assessment','Speaking rubric'],['evidence','Evidence & export']].map(([id,t])=>`<button class="${teacherTab===id?'active':''}" onclick="setTeacherTab('${id}')">${t}</button>`).join('')}</div>${teacherTab==='control'?control():teacherTab==='assessment'?assessment():evidence()}`}function control(){return `<div class="card"><h2>50-minute lesson controller</h2><p class="muted">Select the active classroom phase. Students can still practice at their own pace in this offline prototype.</p><div class="steps">${PHASES.map((x,i)=>`<span class="${i===db.phase?'current':''}">${i+1}. ${x}</span>`).join('')}</div><br><div class="bar">${PHASES.map((x,i)=>`<button class="${i===db.phase?'active':'secondary'}" onclick="setPhase(${i})">${i+1}</button>`).join('')}</div></div><div class="grid"><div class="card"><h2>Mission controller</h2><p>Choose a situation to display in class.</p><div class="bar">${MISSIONS.map(x=>`<button class="${db.activeMission===x.id?'active':'secondary'}" onclick="setMission('${x.id}')">Mission ${x.id}</button>`).join('')}</div><div class="scenario" style="margin-top:16px">${safe(MISSIONS.find(x=>x.id===db.activeMission).text)}</div></div><div class="card"><h2>Teaching prompts</h2><p><strong>Ask:</strong> What is the problem? Which prefix words help you understand it?</p><p><strong>Support:</strong> You should… / Why don't you…? / Because…</p><p><strong>Feedback:</strong> Give one specific correction, then ask the learner to speak again.</p><div class="notice">Keep students speaking face-to-face. Do not display individual scores on the projector.</div></div></div><div class="card"><h2>Local prototype settings</h2><p>Room code: <strong>${db.session}</strong>. Teacher and student views share data only on this browser. For separate devices, a secure server and realtime database must be connected.</p><button class="secondary" onclick="resetDemo()">Reset local demo data</button></div>`}function assessment(){return `<div class="grid"><div class="card"><h2>Teacher Observation</h2><p class="muted">Only assess a student you actually heard speaking. Use attempt 1 and 2 to record genuine retries.</p><label>Student code</label><input id="assessCode" list="codes" placeholder="e.g. S-014"><datalist id="codes">${Object.keys(db.students).map(x=>`<option value="${safe(x)}">`).join('')}</datalist><div class="grid" style="margin-top:12px"><div><label>Mission</label><select id="assessMission">${MISSIONS.map(x=>`<option value="${x.id}">${x.id} · ${x.title}</option>`).join('')}</select></div><div><label>Attempt</label><select id="attempt"><option value="1">1 · First try</option><option value="2">2 · Speak again</option></select></div></div>${[['prefix','Correct prefix words (0–2)'],['communication','Problem and advice (0–2)'],['interaction','Interaction (0–2)']].map(([id,t])=>`<div class="rubric"><label for="${id}">${t}</label><select id="${id}"><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option></select></div>`).join('')}<label>Support observed</label><select id="supportObserved"><option value="1">Level 1 · Full script</option><option value="2">Level 2 · Prompts</option><option value="3">Level 3 · Independent</option></select><p><label>Feedback actually given</label><textarea id="feedback" placeholder="Example: Add a reason with because; try again."></textarea></p><button onclick="recordAssessment()">Save observed assessment</button></div><div class="card"><h2>Rubric descriptors</h2><p><strong>Prefix words:</strong> 2 = at least two used correctly; 1 = one; 0 = none.</p><p><strong>Communication:</strong> 2 = understandable problem and advice; 1 = partial; 0 = not communicated.</p><p><strong>Interaction:</strong> 2 = at least two responses; 1 = one or extensive help; 0 = no response.</p><div class="notice">Pass: at least 4/6 AND communication ≥ 1. Do not infer speaking performance from a quiz score or support selection.</div></div></div>`}function evidence(){const codes=Object.keys(db.students);return `<div class="card"><div class="bar" style="justify-content:space-between"><div><h2>Evidence Dashboard</h2><p class="muted">Local records only · No fabricated results</p></div><button onclick="csv()">⬇ Export CSV</button></div><div class="scroll"><table><thead><tr><th>Code</th><th>Recall /5</th><th>Check /5</th><th>Confidence /3</th><th>Attempt 1</th><th>Attempt 2</th><th>Status</th></tr></thead><tbody>${codes.map(code=>{const s=db.students[code];const sc=k=>{const q=k==='diagnostic'?QUIZ:CHECK;return Object.keys(s[k]||{}).length===5?q.reduce((n,x,i)=>n+(s[k][i]===x.a?1:0),0)+'/5':'—'};const at=n=>{const o=db.observations.filter(x=>x.code===code&&x.attempt===n).at(-1);return o?o.scores.reduce((a,b)=>a+b,0)+'/6':'—'};return `<tr><td>${safe(code)}</td><td>${sc('diagnostic')}</td><td>${sc('check')}</td><td>${s.reflection?.confidence||'—'}</td><td>${at(1)}</td><td>${at(2)}</td><td>${db.observations.some(x=>x.code===code)?'Observed':'Not yet assessed'}</td></tr>`}).join('')||'<tr><td colspan="7">No students have joined this local demo yet.</td></tr>'}</tbody></table></div></div><div class="card"><h2>Evidence integrity</h2><p>Missing observations remain missing. Attempt 1 and Attempt 2 are separate records. Self-reported confidence is not a speaking score. Export only data that was actually entered.</p><p class="muted">For official use, implement authenticated access, secure storage, retention limits, and an approved student-data workflow before deployment.</p></div>`}
function studentView(){if(!studentCode)return `<div class="card" style="max-width:550px;margin:35px auto"><h1>Join your classroom</h1><p class="muted">Use a student code assigned by your teacher. No real name needed.</p><label>Classroom code</label><input id="room" value="${db.session}" maxlength="6"><p><label>Student code</label><input id="code" placeholder="e.g. S-014" maxlength="12"></p><button onclick="join()">Join classroom</button><p class="small muted">Offline demonstration: use Teacher and Student buttons in this same browser to test data flow.</p></div>`;const st=student();return `<div class="bar" style="justify-content:space-between"><h1 class="section-title">Student Lab <span class="pill">${safe(studentCode)}</span></h1><button class="secondary" onclick="leave()">Leave</button></div><div class="card"><div class="muted small">Current teacher phase</div><strong>${PHASES[db.phase]}</strong></div><div class="nav">${[['mission','Mission'],['quiz','Prefix Quiz'],['speaking','Speaking Support'],['advice','Advice Builder'],['reflection','Reflection']].map(([id,t])=>`<button class="${studentTab===id?'active':''}" onclick="setStudentTab('${id}')">${t}</button>`).join('')}</div>${studentTab==='mission'?mission():studentTab==='quiz'?quiz():studentTab==='speaking'?speaking():studentTab==='advice'?advice():reflection()}`}function mission(){return `<div class="card"><h2>Context Detectives</h2><p>Choose a problem. Read it with your partner. Find the prefix words.</p><div class="bar">${MISSIONS.map(x=>`<button class="${missionId===x.id?'active':'secondary'}" onclick="setMission('${x.id}')">${x.id}</button>`).join('')}</div><h3>${m().title}</h3><div class="scenario">${safe(m().text)}</div><p><strong>Target prefix words:</strong> ${m().words.map(x=>`<span class="tag">${x}</span>`).join(' ')}</p><p>Ask your partner: <strong>What is the problem?</strong> Then explain the words in your own words.</p><button onclick="setStudentTab('speaking')">Practice speaking →</button></div>`}function quiz(){const st=student();const qs=quizKind==='diagnostic'?QUIZ:CHECK;return `<div class="card"><h2>Prefix Quiz</h2><div class="bar"><button class="${quizKind==='diagnostic'?'active':'secondary'}" onclick="answerQuiz('diagnostic')">Recall (start)</button><button class="${quizKind==='check'?'active':'secondary'}" onclick="answerQuiz('check')">Check (end)</button></div><p class="muted">Discuss the recall quiz with a partner. Complete the final check individually.</p>${qs.map((q,i)=>`<div style="border-top:1px solid var(--line);padding:12px 0"><strong>${i+1}. ${safe(q.q)}</strong>${q.opts.map((o,j)=>`<button class="choice ${st[quizKind]?.[i]===j?'selected':''}" onclick="choose('${quizKind}',${i},${j})">${String.fromCharCode(65+j)}. ${safe(o)}</button>`).join('')}</div>`).join('')}<div class="notice ${Object.keys(st[quizKind]||{}).length===5?'good':''}">${Object.keys(st[quizKind]||{}).length===5?`Completed: ${score(quizKind)}/5 correct. Ask your teacher about mistakes.`:`Answered ${Object.keys(st[quizKind]||{}).length}/5 questions.`}</div></div>`}function speaking(){return `<div class="card"><h2>Pair Speaking Practice</h2><div class="scenario">${safe(m().text)}</div><p><strong>Choose your support level</strong></p><div class="bar">${[1,2,3].map(n=>`<button class="${support===n?'active':'secondary'}" onclick="setSupport(${n})">Level ${n}</button>`).join('')}</div><div class="card" style="background:#f6f9ff;margin-top:15px">${support===1?`<p><strong>A:</strong> What's wrong?</p><p><strong>B:</strong> ${safe(m().text)}</p><p><strong>A:</strong> ${safe(m().solutions[0])}</p><p><strong>B:</strong> Why?</p><p><strong>A:</strong> Because ${safe(m().reason.charAt(0).toLowerCase()+m().reason.slice(1))}</p><p><strong>B:</strong> Thanks. I'll try that.</p>`:support===2?`<p>A: What's ______?</p><p>B: I feel ______ because ______.</p><p>A: You should ______.</p><p>B: Why?</p><p>A: Because ______.</p><p class="muted">Word bank: ${m().words.join(', ')}, reread, review, talk, listen, correct</p>`:`<p>Speak without a script. Explain the problem, offer two solutions, ask “Why?”, and give a reason.</p>`}</div><div class="notice">Look at your partner, not only your screen. Change roles. Listen to your teacher's feedback and speak again.</div></div>`}function advice(){const st=student();return `<div class="card"><h2>Problem-Solving Clinic</h2><div class="scenario">${safe(m().text)}</div><p>In a group of four: Reader, Prefix Detective, Advice Giver, Questioner. Everyone speaks.</p><label>Advice 1</label><textarea id="adv1" placeholder="You should…">${safe(st.advice?.mission===missionId?st.advice.first:'')}</textarea><label>Advice 2</label><textarea id="adv2" placeholder="Why don't you…?">${safe(st.advice?.mission===missionId?st.advice.second:'')}</textarea><label>Which advice is better? Why?</label><textarea id="reason" placeholder="I think… because…">${safe(st.advice?.mission===missionId?st.advice.reason:'')}</textarea><p><button onclick="saveAdvice()">Save group ideas</button></p><div class="notice">These notes are not a speaking score. Your teacher assesses what you actually say.</div></div>`}function reflection(){const st=student();return `<div class="card"><h2>Wrap-up & Check for Understanding</h2><p>First, complete the final five-question check. Then reflect on your speaking.</p><button class="secondary" onclick="answerQuiz('check')">Open final check</button><p><label>How confidently can you speak now?</label><select id="confidence"><option value="1" ${st.reflection?.confidence===1?'selected':''}>1 · I still need a lot of help</option><option value="2" ${st.reflection?.confidence===2?'selected':''}>2 · I can speak with some help</option><option value="3" ${st.reflection?.confidence===3?'selected':''}>3 · I can speak more independently</option></select></p><label>My next speaking goal</label><textarea id="goal" placeholder="Next time, I will…">${safe(st.reflection?.goal||'')}</textarea><p><button onclick="submitReflection()">Save reflection</button></p>${st.reflection?'<div class="notice good">Reflection saved on this browser.</div>':''}</div>`}function render(){document.getElementById('app').innerHTML=role==='teacher'?teacher():studentView()}render();</script></body></html>
